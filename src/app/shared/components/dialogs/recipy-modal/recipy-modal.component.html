<div class="wrapper">
    @if($recipy()){
    <h2>{{$recipy()!.name}}</h2>
    @if(!isView()){
    <app-recipy-constructor [recipyToPatch]="$recipy()"></app-recipy-constructor>
    }
    @else {
    <app-recipy-full-view [recipy]="$recipy()"></app-recipy-full-view>
    }
    }
    <!-- TODO add view when no recipy is found in db -->
</div>
