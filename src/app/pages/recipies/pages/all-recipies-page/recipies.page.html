<app-header [isShowDoubleToolbar]="false">
  <app-filters top-header-right-button [pageId]="'all-recipies'"></app-filters>
  @if($isShowWidget()){
  <ion-toolbar additional-toolbar><app-active-filters-widget></app-active-filters-widget></ion-toolbar>
  }

</app-header>

<ion-content #scrollingContainer [fullscreen]="true" (ionScroll)="onscroll($event)" [scrollEvents]="true">
  <span id="top-anchor"></span>

  <div class="recipies-background">
    @for(recipy of $recipiesToDisplay(); track recipy.id){
    <div class="card-container">
      <div class="card-wrapper">
        <app-recipe-card [recipy]="recipy" [productPreferencesChips]="productChips()"></app-recipe-card>
      </div>
      <app-comments-block [recipyId]="recipy.id" [recipyName]="recipy.name"></app-comments-block>
    </div>
    }
    <ion-infinite-scroll [disabled]="$recipies().length <= numberOfRecipiesToDisplay()"
      (ionInfinite)="onIonInfinite($event)" [threshold]="threshhold + 'px'">
      <ion-infinite-scroll-content loadingText="Please wait..." loadingSpinner="bubbles"></ion-infinite-scroll-content>
    </ion-infinite-scroll>


  </div>
  @if(showGoTop){
  <ion-fab (click)="goTop()" slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button>
      <ion-icon name="chevron-up-circle"></ion-icon>
    </ion-fab-button>
  </ion-fab>
  }

</ion-content>
