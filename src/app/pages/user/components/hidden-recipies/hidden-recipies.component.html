<div class="recipies-background">
  @for(recipy of $hiddenRecipies(); track recipy.id; let index = $index){
  @if(index < numberOfRecipiesToDisplay){ } <div class="card-container">
    <div class="card-wrapper">
      <app-recipe-card [recipy]="recipy"></app-recipe-card>
    </div>
    <app-comments-block [recipyId]="recipy.id" [recipyName]="recipy.name"></app-comments-block>
</div>
}

</div>
<div class="text" *ngIf="!$noShowIds()?.length">
  Немає прихованих рецептів
</div>
<ion-infinite-scroll *ngIf="numberOfRecipiesToDisplay <= $hiddenRecipies().length"
  (ionInfinite)="onIonInfinite($event)">
  <ion-infinite-scroll-content></ion-infinite-scroll-content>
</ion-infinite-scroll>
