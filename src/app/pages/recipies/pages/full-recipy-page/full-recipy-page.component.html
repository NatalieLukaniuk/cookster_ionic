<app-header>
  <ion-back-button left-button defaultHref="tabs/recipies"></ion-back-button>
  @if($recipy()){
  <p title>{{ $recipy()!.name }}</p>
  
  }
  @if($isShowApproveBtn()){
  <ion-button right-button size="small" (click)="approveRecipy()"><ion-icon name="thumbs-up-outline"
      slot="icon-only"></ion-icon></ion-button>
  }
  @if($isCanEdit()){
    <ion-button right-button size="small" (click)="goEditRecipy()"><ion-icon name="construct-outline"
      slot="icon-only"></ion-icon></ion-button>
  }  

</app-header>

<ion-content>
  @if($recipy()){
  <app-recipy-full-view [recipy]="$recipy()"></app-recipy-full-view>
  <app-comments-block [recipyId]="$recipyId()"></app-comments-block>
  }
  @else {
  <!-- //TODO add content for cases when no recipy -->
  }

</ion-content>
